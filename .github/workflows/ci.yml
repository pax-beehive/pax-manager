name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint-cache
      GOPRIVATE: github.com/pax-beehive/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        env:
          PAX_BEEHIVE_READ_TOKEN: ${{ secrets.PAX_BEEHIVE_READ_TOKEN }}
        run: |
          if [ -z "$PAX_BEEHIVE_READ_TOKEN" ]; then
            echo "PAX_BEEHIVE_READ_TOKEN is required to download private pax-beehive Go modules." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${PAX_BEEHIVE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Unit tests with coverage
        run: make test-coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.out
          if-no-files-found: error

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOCACHE: /tmp/go-build
      GOPRIVATE: github.com/pax-beehive/*
      PAX_BEEHIVE_READ_TOKEN: ${{ secrets.PAX_BEEHIVE_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        run: |
          if [ -z "$PAX_BEEHIVE_READ_TOKEN" ]; then
            echo "PAX_BEEHIVE_READ_TOKEN is required to download private pax-beehive Go modules." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${PAX_BEEHIVE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Run integration tests
        run: make integration-test

      - name: Clean integration stack
        if: always()
        run: make integration-down
