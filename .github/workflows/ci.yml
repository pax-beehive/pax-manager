name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOCACHE: /tmp/go-build
      GOLANGCI_LINT_CACHE: /tmp/golangci-lint-cache
      GOPRIVATE: github.com/pax-beehive/*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        env:
          PAX_BEEHIVE_READ_TOKEN: ${{ secrets.PAX_BEEHIVE_READ_TOKEN }}
        run: |
          if [ -z "$PAX_BEEHIVE_READ_TOKEN" ]; then
            echo "PAX_BEEHIVE_READ_TOKEN is required to download private pax-beehive Go modules." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${PAX_BEEHIVE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Unit tests with coverage
        run: make test-coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.out
          if-no-files-found: error

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOCACHE: /tmp/go-build
      GOPRIVATE: github.com/pax-beehive/*
      PAX_BEEHIVE_READ_TOKEN: ${{ secrets.PAX_BEEHIVE_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        run: |
          if [ -z "$PAX_BEEHIVE_READ_TOKEN" ]; then
            echo "PAX_BEEHIVE_READ_TOKEN is required to download private pax-beehive Go modules." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${PAX_BEEHIVE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Prepare pinned integration object storage images
        run: |
          docker build --platform linux/amd64 --target minio \
            -f integration/images/minio.Dockerfile \
            -t quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z .
          docker build --platform linux/amd64 --target mc \
            -f integration/images/minio.Dockerfile \
            -t quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1 .

      - name: Run integration tests
        run: make integration-test

      - name: Clean integration stack
        if: always()
        run: make integration-down

  region-directory:
    name: Region directory Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/region-directory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/region-directory/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.16.2
      - run: python -m coverage run --branch --source=ci_publish -m unittest test_ci_publish -v
      - run: python -m coverage report --fail-under=80
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'

  publish-image:
    name: Publish verified main image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, integration, region-directory]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    secrets:
      PAX_RELEASE_PUBLISHER_TOKEN: ${{ secrets.PAX_RELEASE_PUBLISHER_TOKEN }}
      PAX_RELEASE_CF_CLIENT_ID: ${{ secrets.PAX_RELEASE_CF_CLIENT_ID }}
      PAX_RELEASE_CF_CLIENT_SECRET: ${{ secrets.PAX_RELEASE_CF_CLIENT_SECRET }}
      PAX_BEEHIVE_READ_TOKEN: ${{ secrets.PAX_BEEHIVE_READ_TOKEN }}

  publish-worker:
    name: Upload verified main Worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAX_WORKER_RELEASE_ENABLED == 'true'
    needs: [checks, integration, region-directory]
    uses: ./.github/workflows/publish-worker.yml
    secrets:
      PAX_WORKER_CF_API_TOKEN: ${{ secrets.PAX_WORKER_CF_API_TOKEN }}
      PAX_RELEASE_PUBLISHER_TOKEN: ${{ secrets.PAX_RELEASE_PUBLISHER_TOKEN }}
      PAX_RELEASE_CF_CLIENT_ID: ${{ secrets.PAX_RELEASE_CF_CLIENT_ID }}
      PAX_RELEASE_CF_CLIENT_SECRET: ${{ secrets.PAX_RELEASE_CF_CLIENT_SECRET }}
