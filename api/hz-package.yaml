layouts:
  - path: handler.go
    body: |
      // Code generated by hertz generator. DO NOT EDIT.
      package {{.PackageName}}
      import (
        "context"
        "github.com/cloudwego/hertz/pkg/app"
      )
      {{range .Methods}}
      {{.Comment}}
      func {{.Name}}(ctx context.Context, c *app.RequestContext) {
        serviceFromContext(c).HandleGenerated(ctx, c, "{{.Name}}")
      }
      {{end}}
  - path: handler_single.go
    body: |
      {{.Comment}}
      func {{.Name}}(ctx context.Context, c *app.RequestContext) {
        serviceFromContext(c).HandleGenerated(ctx, c, "{{.Name}}")
      }
