global:
  scrape_interval: 30s
  scrape_timeout: 5s

storage:
  tsdb:
    retention:
      time: 14d
      size: 2GB

scrape_configs:
  - job_name: pax-manager
    scheme: https
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pax_metrics_token
    tls_config:
      ca_file: /run/secrets/pax_metrics_ca
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
