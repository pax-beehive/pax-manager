# Use a unique project name; this stack does not share normal development volumes.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pax
      POSTGRES_PASSWORD: pax
      POSTGRES_DB: search_test
    ports:
      - "127.0.0.1:${SEARCH_TEST_PG_PORT:-15432}:5432"
    volumes:
      - search-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pax -d search_test"]
      interval: 2s
      timeout: 3s
      retries: 40

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 2g
    ports:
      - "127.0.0.1:${SEARCH_TEST_PORT:-19200}:9200"
    volumes:
      - search-test-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 40
volumes:
  search-test-postgres-data:
  search-test-data:
