services:

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${PAX_CONSOLE_ORIGIN:-http://localhost:3000}
    ports:
      - "${OBJECT_STORAGE_PORT:-9000}:9000"
    volumes:
      - pax-manager-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-pax-artifacts}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET"
        mc version enable "local/$$OBJECT_STORAGE_BUCKET"

  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: pax-manager-postgres:local
    container_name: pax-manager-postgres
    environment:
      POSTGRES_USER: pax
      POSTGRES_PASSWORD: pax
      POSTGRES_DB: paxdb
    ports:
      - "5432:5432"
    volumes:
      - pax-manager-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pax -d paxdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  manager:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: pax-manager
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: "9879"
      DATABASE_URL: postgres://pax:pax@postgres:5432/paxdb?sslmode=disable
      LOCAL_USER_ID: local@example.local
      CLOUDFLARE_ACCESS_DISABLED: "true"
      ALLOW_LOCAL_USER_HEADER: "true"
      ADMIN_EMAILS: local@example.local
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-pax-artifacts}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set OBJECT_STORAGE_PUBLIC_ENDPOINT}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${MINIO_ROOT_USER:?set MINIO_ROOT_USER}}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "9879:9879"

volumes:
  pax-manager-postgres-data:
  pax-manager-minio-data:

secrets:
  github_token:
    environment: PAX_BEEHIVE_READ_TOKEN
