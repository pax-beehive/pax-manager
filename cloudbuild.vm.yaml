substitutions:
  _REGION: us-west1
  _REPOSITORY: pax-manager
  _IMAGE: pax-manager
  _VM_NAME: pax-manager-monolithic
  _VM_ZONE: us-west1-b
  _CLOUD_SQL_INSTANCE: pax-tech-499219:us-west1:pax-manager-postgres
  _DB_SECRET: pax-manager-database-url
  _DEPLOY_SCRIPT: /opt/pax-manager/deploy.sh
  _OBJECT_STORAGE_BUCKET: pax-artifacts
  _OBJECT_STORAGE_REGION: us-east-1
  _OBJECT_STORAGE_ENDPOINT: ""
  _OBJECT_STORAGE_PUBLIC_ENDPOINT: ""
  _OBJECT_STORAGE_FORCE_PATH_STYLE: "false"
  _AWS_ACCESS_KEY_ID_SECRET: pax-manager-object-storage-access-key-id
  _AWS_SECRET_ACCESS_KEY_SECRET: pax-manager-object-storage-secret-access-key
  _AWS_SESSION_TOKEN_SECRET: ""
  _SSH_KEY_FILE: /workspace/.ssh/pax-manager-cloud-build
  _SSH_KEY_TTL: 30m

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - PAX_BEEHIVE_READ_TOKEN
    args:
      - build
      - --secret
      - id=github_token,env=PAX_BEEHIVE_READ_TOKEN
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  # Reuse one key across all VM steps. Fresh step containers otherwise create
  # separate OS Login keys, eventually exceed the profile limit, and can race
  # OS Login propagation on their first connection.
  - id: prepare-os-login-key
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        for fp in $$(gcloud compute os-login ssh-keys list --format='value(value.fingerprint)' 2>/dev/null); do
          gcloud compute os-login ssh-keys remove --key "$$fp" || true
        done
        mkdir -p /workspace/.ssh
        chmod 0700 /workspace/.ssh
        rm -f "${_SSH_KEY_FILE}" "${_SSH_KEY_FILE}.pub"
        ssh-keygen -q -t rsa -b 3072 -N '' -f "${_SSH_KEY_FILE}"

  - id: prepare-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        for attempt in $$(seq 1 6); do
          if gcloud compute ssh "${_VM_NAME}" \
            --zone "${_VM_ZONE}" \
            --ssh-key-file "${_SSH_KEY_FILE}" \
            --ssh-key-expire-after "${_SSH_KEY_TTL}" \
            --command "mkdir -p /tmp/pax-manager-vm"; then
            exit 0
          fi
          if [ "$$attempt" -lt 6 ]; then
            sleep 5
          fi
        done
        exit 1

  - id: copy-vm-scripts
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - scp
      - deploy/vm/bootstrap.sh
      - deploy/vm/deploy.sh
      - ${_VM_NAME}:/tmp/pax-manager-vm/
      - --zone
      - ${_VM_ZONE}
      - --ssh-key-file
      - ${_SSH_KEY_FILE}
      - --ssh-key-expire-after
      - ${_SSH_KEY_TTL}

  - id: bootstrap-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - ${_VM_NAME}
      - --zone
      - ${_VM_ZONE}
      - --ssh-key-file
      - ${_SSH_KEY_FILE}
      - --ssh-key-expire-after
      - ${_SSH_KEY_TTL}
      - --command
      - >
        sudo install -d -m 0755 /opt/pax-manager;
        sudo install -m 0755 /tmp/pax-manager-vm/bootstrap.sh /opt/pax-manager/bootstrap.sh;
        sudo install -m 0755 /tmp/pax-manager-vm/deploy.sh /opt/pax-manager/deploy.sh;
        sudo /opt/pax-manager/bootstrap.sh ${_CLOUD_SQL_INSTANCE}

  - id: deploy-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - ${_VM_NAME}
      - --zone
      - ${_VM_ZONE}
      - --ssh-key-file
      - ${_SSH_KEY_FILE}
      - --ssh-key-expire-after
      - ${_SSH_KEY_TTL}
      - --command
      - >
        sudo ${_DEPLOY_SCRIPT}
        ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
        ${_DB_SECRET}
        deepseek_api_key
        ${_OBJECT_STORAGE_BUCKET}
        ${_OBJECT_STORAGE_REGION}
        '${_OBJECT_STORAGE_ENDPOINT}'
        '${_OBJECT_STORAGE_PUBLIC_ENDPOINT}'
        ${_OBJECT_STORAGE_FORCE_PATH_STYLE}
        ${_AWS_ACCESS_KEY_ID_SECRET}
        ${_AWS_SECRET_ACCESS_KEY_SECRET}
        '${_AWS_SESSION_TOKEN_SECRET}'

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/PAX_BEEHIVE_READ_TOKEN/versions/latest
      env: PAX_BEEHIVE_READ_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
