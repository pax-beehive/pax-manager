substitutions:
  _REGION: us-west1
  _REPOSITORY: pax-manager
  _IMAGE: pax-manager
  _VM_NAME: pax-manager-monolithic
  _VM_ZONE: us-west1-b
  _CLOUD_SQL_INSTANCE: pax-tech-499219:us-west1:pax-manager-postgres
  _DB_SECRET: pax-manager-database-url
  _DEPLOY_SCRIPT: /opt/pax-manager/deploy.sh
  _SSH_KEY_TTL: 30m

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - PAX_BEEHIVE_READ_TOKEN
    args:
      - build
      - --secret
      - id=github_token,env=PAX_BEEHIVE_READ_TOKEN
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

  # Every gcloud compute ssh/scp step below runs in a fresh container, so each
  # one adds a brand-new key to the build service account's OS Login profile.
  # Without cleanup the profile eventually exceeds the 32 KiB limit and ssh
  # fails with FAILED_PRECONDITION. Trim the profile up front and let new keys
  # expire on their own.
  - id: trim-os-login-keys
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        for fp in $$(gcloud compute os-login ssh-keys list --format='value(value.fingerprint)' 2>/dev/null); do
          gcloud compute os-login ssh-keys remove --key "$$fp" || true
        done

  - id: prepare-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - ${_VM_NAME}
      - --zone
      - ${_VM_ZONE}
      - --ssh-key-expire-after
      - ${_SSH_KEY_TTL}
      - --command
      - mkdir -p /tmp/pax-manager-vm

  - id: copy-vm-scripts
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - scp
      - deploy/vm/bootstrap.sh
      - deploy/vm/deploy.sh
      - ${_VM_NAME}:/tmp/pax-manager-vm/
      - --zone
      - ${_VM_ZONE}
      - --ssh-key-expire-after
      - ${_SSH_KEY_TTL}

  - id: bootstrap-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - ${_VM_NAME}
      - --zone
      - ${_VM_ZONE}
      - --ssh-key-expire-after
      - ${_SSH_KEY_TTL}
      - --command
      - >
        sudo install -d -m 0755 /opt/pax-manager;
        sudo install -m 0755 /tmp/pax-manager-vm/bootstrap.sh /opt/pax-manager/bootstrap.sh;
        sudo install -m 0755 /tmp/pax-manager-vm/deploy.sh /opt/pax-manager/deploy.sh;
        sudo /opt/pax-manager/bootstrap.sh ${_CLOUD_SQL_INSTANCE}

  - id: deploy-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - ssh
      - ${_VM_NAME}
      - --zone
      - ${_VM_ZONE}
      - --ssh-key-expire-after
      - ${_SSH_KEY_TTL}
      - --command
      - sudo ${_DEPLOY_SCRIPT} ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA} ${_DB_SECRET}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/PAX_BEEHIVE_READ_TOKEN/versions/latest
      env: PAX_BEEHIVE_READ_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
