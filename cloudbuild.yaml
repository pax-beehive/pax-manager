# DEPRECATED: archived Cloud Run build/push pipeline. Deployment is intentionally
# disabled because the old Cloud Run path does not provision the required S3
# object-storage configuration and credentials. Production CI/CD uses
# cloudbuild.vm.yaml. Do not attach triggers to this file.

substitutions:
  _REGION: us-west1
  _REPOSITORY: pax-manager
  _IMAGE: pax-manager

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    secretEnv:
      - PAX_BEEHIVE_READ_TOKEN
    args:
      - build
      - --secret
      - id=github_token,env=PAX_BEEHIVE_READ_TOKEN
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}
      - .

  - id: push-sha
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/PAX_BEEHIVE_READ_TOKEN/versions/latest
      env: PAX_BEEHIVE_READ_TOKEN

options:
  logging: CLOUD_LOGGING_ONLY
