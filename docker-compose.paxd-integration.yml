services:

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "${MINIO_PORT:-29000}:9000"
    volumes:
      - pax-manager-paxd-integration-minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_started
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-pax-artifacts}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing "local/$$OBJECT_STORAGE_BUCKET"
        mc version enable "local/$$OBJECT_STORAGE_BUCKET"

  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: pax-manager-postgres:local
    environment:
      POSTGRES_USER: pax
      POSTGRES_PASSWORD: pax
      POSTGRES_DB: paxdb
    volumes:
      - pax-manager-paxd-integration-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pax -d paxdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  manager:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: "9879"
      DATABASE_URL: postgres://pax:pax@postgres:5432/paxdb?sslmode=disable
      LOCAL_USER_ID: local@example.local
      CLOUDFLARE_ACCESS_DISABLED: "true"
      ALLOW_LOCAL_USER_HEADER: "true"
      ADMIN_EMAILS: local@example.local
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-pax-artifacts}
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-29000}
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "${INTEGRATION_PORT:-19879}:9879"

  paxd:
    build:
      context: ../paxd
      dockerfile: Dockerfile.integration
    depends_on:
      manager:
        condition: service_started
    environment:
      PAX_CLOUD_URL: http://manager:9879
      PAX_REGISTRATION_TOKEN: ${PAX_REGISTRATION_TOKEN:-}
      PAX_NODE_ID: ${PAX_NODE_ID:-}
      PAX_NODE_API_KEY: ${PAX_NODE_API_KEY:-}
      PAX_AGENT_ID: ${PAX_AGENT_ID:-}
      PAX_NODE_NAME: integration-node
      PAX_MACHINE_TYPE: docker
      HERMES_API_ENDPOINT: http://127.0.0.1:8642
      PAXD_DB_PATH: /data/paxd.db
    volumes:
      - paxd-integration-data:/data

volumes:
  pax-manager-paxd-integration-postgres-data:
  pax-manager-paxd-integration-minio-data:
  paxd-integration-data:

secrets:
  github_token:
    environment: PAX_BEEHIVE_READ_TOKEN
