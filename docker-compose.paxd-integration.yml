services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: pax-manager-postgres:local
    environment:
      POSTGRES_USER: pax
      POSTGRES_PASSWORD: pax
      POSTGRES_DB: paxdb
    volumes:
      - pax-manager-paxd-integration-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pax -d paxdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  manager:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "9879"
      DATABASE_URL: postgres://pax:pax@postgres:5432/paxdb?sslmode=disable
      LOCAL_USER_ID: local@example.local
      CLOUDFLARE_ACCESS_DISABLED: "true"
      ALLOW_LOCAL_USER_HEADER: "true"
      ADMIN_EMAILS: local@example.local
    ports:
      - "${INTEGRATION_PORT:-19879}:9879"

  paxd:
    build:
      context: ../paxd
      dockerfile: Dockerfile.integration
    depends_on:
      manager:
        condition: service_started
    environment:
      PAX_CLOUD_URL: http://manager:9879
      PAX_REGISTRATION_TOKEN: ${PAX_REGISTRATION_TOKEN:-}
      PAX_NODE_ID: ${PAX_NODE_ID:-}
      PAX_NODE_API_KEY: ${PAX_NODE_API_KEY:-}
      PAX_AGENT_ID: ${PAX_AGENT_ID:-}
      PAX_NODE_NAME: integration-node
      PAX_MACHINE_TYPE: docker
      HERMES_API_ENDPOINT: http://127.0.0.1:8642
      PAXD_DB_PATH: /data/paxd.db
    volumes:
      - paxd-integration-data:/data

volumes:
  pax-manager-paxd-integration-postgres-data:
  paxd-integration-data:

secrets:
  github_token:
    environment: PAX_BEEHIVE_READ_TOKEN
