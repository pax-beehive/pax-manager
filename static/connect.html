<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect paxd</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0c;color:#e6e6e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{width:min(420px,calc(100vw - 32px))}
  h1{font-size:22px;margin:0 0 18px}
  form{display:grid;gap:12px}
  input,button{height:42px;border-radius:6px;border:1px solid #303038;background:#111114;color:#e6e6e6;font-size:16px;padding:0 12px}
  input{text-transform:uppercase;letter-spacing:.08em}
  button{background:#1f6feb;border-color:#1f6feb;font-weight:650;cursor:pointer}
  button:disabled{opacity:.5;cursor:not-allowed}
  p{color:#8b949e;line-height:1.45}
  #status{min-height:22px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Connect paxd</h1>
  <form id="form">
    <input id="code" maxlength="6" autocomplete="one-time-code" placeholder="ABC123">
    <button id="button" type="submit">Approve</button>
    <p id="status"></p>
  </form>
</main>
<script>
const params = new URLSearchParams(location.search);
const codeInput = document.getElementById('code');
const statusEl = document.getElementById('status');
const button = document.getElementById('button');
codeInput.value = (params.get('code') || '').toUpperCase();

document.getElementById('form').addEventListener('submit', async event => {
  event.preventDefault();
  const code = codeInput.value.trim().toUpperCase();
  if (!code) return;
  button.disabled = true;
  statusEl.textContent = 'Approving...';
  try {
    const res = await fetch(`/api/v1/user/self/node-registrations/${encodeURIComponent(code)}/approve`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: '{}',
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || 'approval failed');
    statusEl.textContent = 'Approved. You can return to the terminal.';
  } catch (error) {
    statusEl.textContent = error.message;
    button.disabled = false;
  }
});
</script>
</body>
</html>
