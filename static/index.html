<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pax-manager Dashboard</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b0b0c;color:#e6e6e6;height:100vh;display:flex;flex-direction:column}
  header{height:48px;border-bottom:1px solid #242428;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111114}
  h1{font-size:15px;font-weight:650}
  .status{font-size:12px;color:#8b949e}
  main{flex:1;display:grid;grid-template-columns:280px 1fr;min-height:0}
  aside{border-right:1px solid #242428;background:#101012;overflow:auto;padding:14px}
  .section-title{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.08em;margin:4px 0 10px}
  .agent{width:100%;text-align:left;background:transparent;color:#ddd;border:1px solid transparent;border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer}
  .agent:hover{background:#19191d}
  .agent.active{border-color:#4f8cff;background:#142034}
  .agent-name{font-size:13px;font-weight:600}
  .agent-meta{font-size:11px;color:#8b949e;margin-top:4px}
  .content{display:grid;grid-template-rows:1fr auto;min-height:0}
  .panes{display:grid;grid-template-columns:320px 1fr;min-height:0}
  .sessions{border-right:1px solid #242428;padding:14px;overflow:auto}
  .session{width:100%;text-align:left;background:#141416;color:#ddd;border:1px solid #25252a;border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer}
  .session.active{border-color:#4f8cff}
  .session-name{font-size:13px;font-weight:600}
  .session-meta{font-size:11px;color:#8b949e;margin-top:4px}
  .messages{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .msg{border:1px solid #25252a;background:#141416;border-radius:6px;padding:10px;font-size:13px;line-height:1.45;white-space:pre-wrap}
  .msg.pending{border-color:#8a6d1d}
  .msg.completed{border-color:#245c35}
  .msg.failed{border-color:#7a2525}
  .composer{border-top:1px solid #242428;padding:12px;display:grid;grid-template-columns:120px 1fr 96px;gap:8px}
  select,input,button{background:#111114;color:#e6e6e6;border:1px solid #303038;border-radius:6px;padding:9px 10px;font-size:13px}
  button{background:#1f6feb;border-color:#1f6feb;cursor:pointer;font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>pax-manager Dashboard</h1>
  <span class="status" id="status">loading</span>
</header>
<main>
  <aside>
    <div class="section-title">Agents</div>
    <div id="agents"></div>
  </aside>
  <section class="content">
    <div class="panes">
      <div class="sessions">
        <div class="section-title">Sessions</div>
        <div id="sessions"></div>
      </div>
      <div class="messages" id="messages"></div>
    </div>
    <div class="composer">
      <select id="messageType">
        <option value="chat">chat</option>
        <option value="steer">steer</option>
        <option value="command">command</option>
      </select>
      <input id="messageInput" placeholder="Send a mailbox message" onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>
  </section>
</main>
<script>
let selectedAgent = '';
let selectedSession = '';

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: {'Content-Type': 'application/json', ...(options.headers || {})},
    ...options,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadAgents() {
  const data = await api('/api/user/agents');
  const agents = data.agents || [];
  const root = document.getElementById('agents');
  root.innerHTML = agents.map(agent => `
    <button class="agent ${agent.agentId === selectedAgent ? 'active' : ''}" onclick="selectAgent('${agent.agentId}')">
      <div class="agent-name">${escapeHtml(agent.name || agent.hostname || agent.agentId)}</div>
      <div class="agent-meta">${escapeHtml(agent.status)} / ${escapeHtml(agent.agentType || 'unknown')}</div>
    </button>
  `).join('');
  if (!selectedAgent && agents.length) await selectAgent(agents[0].agentId);
  document.getElementById('status').textContent = `${agents.length} agents`;
}

async function selectAgent(agentId) {
  selectedAgent = agentId;
  selectedSession = '';
  await loadSessions();
  await loadMailbox();
}

async function loadSessions() {
  if (!selectedAgent) return;
  const data = await api(`/api/user/agents/${encodeURIComponent(selectedAgent)}/sessions`);
  const sessions = data.sessions || [];
  const root = document.getElementById('sessions');
  root.innerHTML = sessions.map(session => `
    <button class="session ${session.sessionId === selectedSession ? 'active' : ''}" onclick="selectSession('${session.sessionId}')">
      <div class="session-name">${escapeHtml(session.name || session.sessionId)}</div>
      <div class="session-meta">${escapeHtml(session.status)} / ${escapeHtml(session.currentTask || '')}</div>
    </button>
  `).join('');
}

async function selectSession(sessionId) {
  selectedSession = sessionId;
  await loadMailbox();
}

async function loadMailbox() {
  const params = new URLSearchParams();
  if (selectedAgent) params.set('agent_id', selectedAgent);
  if (selectedSession) params.set('session_id', selectedSession);
  const data = await api(`/api/user/mailbox?${params.toString()}`);
  const root = document.getElementById('messages');
  root.innerHTML = (data.messages || []).map(msg => `
    <div class="msg ${escapeHtml(msg.status)}">
      <strong>${escapeHtml(msg.messageType)} / ${escapeHtml(msg.status)}</strong>
      <div>${escapeHtml(msg.message)}</div>
      ${msg.result ? `<div>${escapeHtml(msg.result)}</div>` : ''}
      ${msg.error ? `<div>${escapeHtml(msg.error)}</div>` : ''}
    </div>
  `).join('');
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const message = input.value.trim();
  if (!selectedAgent || !message) return;
  await api('/api/user/message', {
    method: 'POST',
    body: JSON.stringify({
      agentId: selectedAgent,
      sessionId: selectedSession,
      message,
      messageType: document.getElementById('messageType').value,
    }),
  });
  input.value = '';
  await loadMailbox();
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[char]));
}

loadAgents().catch(err => {
  document.getElementById('status').textContent = 'error';
  document.getElementById('messages').textContent = err.message;
});
setInterval(() => {
  loadAgents().then(loadSessions).then(loadMailbox).catch(() => {});
}, 5000);
</script>
</body>
</html>
