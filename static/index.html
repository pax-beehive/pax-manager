<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pax-manager — Test Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #fff; }
  .status { font-size: 12px; padding: 4px 10px; border-radius: 12px; }
  .status.online { background: #0f3; color: #000; }
  .status.offline { background: #333; color: #888; }
  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .sidebar {
    width: 240px;
    background: #0d0d0d;
    border-right: 1px solid #222;
    padding: 16px;
    overflow-y: auto;
  }
  .sidebar h3 { font-size: 12px; color: #666; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .agent-item {
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 4px;
  }
  .agent-item:hover { background: #1a1a1a; }
  .agent-item.active { background: #1a3a5c; color: #6af; }
  .agent-item .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; }
  .agent-item .dot.online { background: #0f3; }
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user { align-self: flex-end; background: #1a3a5c; color: #cde; }
  .msg.assistant { align-self: flex-start; background: #1a1a1a; color: #ddd; }
  .msg.tool { align-self: flex-start; background: #1a1f0a; color: #8a8; font-size: 11px; font-family: monospace; }
  .msg.status {
    align-self: center;
    background: transparent;
    color: #555;
    font-size: 11px;
    padding: 4px;
  }
  .input-area {
    border-top: 1px solid #222;
    padding: 12px 20px;
    display: flex;
    gap: 8px;
  }
  .input-area input {
    flex: 1;
    background: #111;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 14px;
    color: #e0e0e0;
    font-size: 13px;
    outline: none;
  }
  .input-area input:focus { border-color: #6af; }
  .input-area button {
    background: #1a3a5c;
    border: none;
    color: #cde;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .input-area button:hover { background: #245080; }
</style>
</head>
<body>
<header>
  <h1>🧪 pax-manager · Test Dashboard</h1>
  <span class="status offline" id="connStatus">disconnected</span>
</header>
<main>
  <aside class="sidebar">
    <h3>Agents</h3>
    <div id="agentList"></div>
  </aside>
  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="promptInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">Send</button>
    </div>
  </div>
</main>

<script>
const wsUrl = 'ws://' + location.host + '/ws';
let ws;
let selectedAgent = null;

function connect() {
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    document.getElementById('connStatus').textContent = 'connected';
    document.getElementById('connStatus').className = 'status online';
    // First message: identify as UI (list_projects style)
    ws.send(JSON.stringify({type: 'list_projects'}));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };

  ws.onclose = () => {
    document.getElementById('connStatus').textContent = 'disconnected';
    document.getElementById('connStatus').className = 'status offline';
    setTimeout(connect, 2000);
  };
}

function handleMessage(msg) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg';

  // Agent registration
  if (msg.type === 'agent_online') {
    addAgent(msg.agentId || msg.name, msg.agentType, msg.hostname);
    div.className = 'msg status';
    div.textContent = `🟢 ${msg.name || msg.agentId} online (${msg.agentType})`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
  if (msg.type === 'agent_offline') {
    removeAgent(msg.agentId);
    div.className = 'msg status';
    div.textContent = `⚫ ${msg.agentId} offline`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }

  // Model events from agent
  if (msg.entity_type === 'agent' && msg.event_type === 'status') {
    div.className = 'msg status';
    div.textContent = `${msg.icon || ''} ${msg.label} ${msg.detail || ''}`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
  if (msg.entity_type === 'message' && msg.event_type === 'delta') {
    if (msg.role === 'tool') {
      div.className = 'msg tool';
    } else {
      div.className = 'msg assistant';
    }
    div.textContent = msg.content;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
  if (msg.entity_type === 'tool' && msg.event_type === 'call') {
    div.className = 'msg tool';
    div.textContent = `🔧 ${msg.name}: ${truncate(msg.arguments, 100)}`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
  if (msg.entity_type === 'file' && msg.event_type === 'changed') {
    div.className = 'msg tool';
    const paths = (msg.changes || []).map(c => c.path).join(', ');
    div.textContent = `📁 files changed: ${paths}`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }

  // Legacy message types
  if (msg.type === 'agent_message' || msg.type === 'turn_result') {
    div.className = 'msg assistant';
    div.textContent = msg.content || JSON.stringify(msg.events || msg, null, 2);
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
  if (msg.type === 'agent_error') {
    div.className = 'msg tool';
    div.textContent = '❌ ' + (msg.error || 'unknown error');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
  if (msg.type === 'agent_done' || msg.type === 'agent_cancelled') {
    div.className = 'msg status';
    div.textContent = msg.type === 'agent_cancelled' ? '⏹️ cancelled' : '✅ done';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return;
  }
}

function addAgent(id, agentType, hostname) {
  selectedAgent = id;
  document.getElementById('agentList').innerHTML = `
    <div class="agent-item active">
      <span class="dot online"></span>${id}
      <div style="font-size:10px;color:#555;margin-left:14px">${agentType || 'hermes'}</div>
    </div>
  `;
}

function removeAgent(id) {
  if (selectedAgent === id) selectedAgent = null;
  document.getElementById('agentList').innerHTML = '';
}

function send() {
  const input = document.getElementById('promptInput');
  const text = input.value.trim();
  if (!text || !ws) return;
  input.value = '';

  const msg = {
    type: 'agent_prompt',
    agentId: selectedAgent,
    prompt: text,
  };
  ws.send(JSON.stringify(msg));

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function truncate(s, n) {
  if (!s) return '';
  s = String(s);
  return s.length > n ? s.slice(0, n) + '…' : s;
}

connect();
</script>
</body>
</html>
